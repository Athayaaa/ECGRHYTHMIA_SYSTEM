[platformio]
default_envs = esp32dev_dummy_usb

[env:esp32dev_dummy]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D BOARD_ESP32_DEV
    -D ENABLE_DUMMY_DEFAULT=1

[env:esp32dev_dummy_usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D BOARD_ESP32_DEV
    -D ENABLE_DUMMY_DEFAULT=1
    -D ECG_OUTPUT_USB=1

[env:esp32dev_ads1293_usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D BOARD_ESP32_DEV
    -D ENABLE_ADS1293=1
    -D ECG_OUTPUT_USB=1
lib_deps =
    ; Official ProtoCentral ADS1293 Arduino library/reference:
    ; https://github.com/Protocentral/protocentral-ads1293-arduino
    https://github.com/Protocentral/protocentral-ads1293-arduino.git#1.3.0
