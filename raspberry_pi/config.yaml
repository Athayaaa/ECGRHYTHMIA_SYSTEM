serial:
  port: /dev/ttyUSB0
  baudrate: 115200
  timeout_seconds: 0.1
  read_size_bytes: 1024
  startup_delay_sec: 3.0
  flush_on_start: true

source: ads1293
send_start_commands: true
start_commands:
  - "ads debug off"
  - "ads start"
  - "ads stream start"

sampling:
  sample_rate_hz: 250
  frame_seconds: 10

output:
  directory: data
  raw_csv: raw_ecg.csv
  sqlite_db: ecg_metadata.sqlite

runtime:
  status_interval_seconds: 5

device:
  device_id: esp32dev_dummy
  state: stored
