serial:
  port: /dev/ttyUSB0
  baudrate: 115200
  timeout_seconds: 0.1
  read_size_bytes: 1024
  startup_delay_sec: 3.0
  flush_on_start: true
  config_response_timeout_seconds: 1.5

source: ads1293
send_start_commands: true
ads1293_boot_delay_sec: 6.0
stream_detect_timeout_sec: 5.0
startup_retries: 3
serial_session_retries: 2
serial_reopen_delay_sec: 1.0
ads1293_ready_check_timeout_sec: 3.0
ads1293_ready_poll_interval_sec: 0.5
ads1293_status_read_timeout_sec: 0.8
ads1293_require_drdy_pin: true
start_commands:
  - "ads stream stop"
  - "ads debug off"
  - "ads config dump"
  - "ads start"
  - "ads stream start"

sampling:
  sample_rate_hz: 250
  frame_seconds: 10

output:
  directory: data
  raw_csv: raw_ecg.csv
  sqlite_db: ecg_metadata.sqlite
  calibration_config: calibration_config_ads1293_266p667_nominal.yaml
  calibrated_directory: calibrated
  native_capture_enabled: false
  native_directory: native

runtime:
  status_interval_seconds: 5
  saturation_margin_counts: 8192

device:
  device_id: from_verified_firmware
  state: stored

model_ready_export:
  enabled: false
  output_dir: data/model_ready
  max_abs_mv: 10.0
